<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长安夜巡 · 李世民骑摩托</title>
<style>
  :root{
    --sp: 1;                 /* 全局速度倍率 */
    --ink: #f3e6c8;
    --gold: #e8b64c;
    --red: #c8322b;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#08060f; overflow:hidden; }
  body{
    font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC","Microsoft YaHei",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 120%, #2a1533 0%, #0b0716 60%, #060409 100%);
  }
  .frame{
    position:relative; width:100%; max-width:1400px; aspect-ratio:16/9;
    box-shadow:0 0 120px rgba(232,182,76,.10), 0 30px 80px rgba(0,0,0,.7);
    border:1px solid rgba(232,182,76,.22);
    border-radius:6px; overflow:hidden;
  }
  svg{ display:block; width:100%; height:100%; }

  /* ---------- 视差层：无缝滚动 ---------- */
  .layer{ animation-name: scroll; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes scroll{ from{ transform:translateX(0); } to{ transform:translateX(-1200px); } }
  .l-far   { animation-duration: calc(150s / var(--sp)); }
  .l-palace{ animation-duration: calc(72s / var(--sp)); }
  .l-wall  { animation-duration: calc(38s / var(--sp)); }
  .l-mid   { animation-duration: calc(17s / var(--sp)); }
  .l-back  { animation-duration: calc(9s / var(--sp)); }
  .l-ground{ animation-duration: calc(3.2s / var(--sp)); }
  .l-front { animation-duration: calc(2.1s / var(--sp)); }

  /* ---------- 人物 / 车辆 ---------- */
  .bike{ transform-box: fill-box; transform-origin: 50% 100%; animation: bounce calc(.85s / var(--sp)) ease-in-out infinite alternate; }
  @keyframes bounce{
    0%   { transform: translate(0,0) rotate(-.7deg); }
    100% { transform: translate(0,-5px) rotate(.9deg); }
  }
  .wheel{ transform-box: fill-box; transform-origin: center; animation: spin calc(.55s / var(--sp)) linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .puff{ opacity:0; transform-box: fill-box; transform-origin: center; animation: puff calc(1.5s / var(--sp)) ease-out infinite; }
  @keyframes puff{
    0%  { opacity:.5;  transform: translate(0,0) scale(.35); }
    60% { opacity:.28; }
    100%{ opacity:0;   transform: translate(-90px,-46px) scale(2.6); }
  }
  .p2{ animation-delay: calc(-.5s / var(--sp)); }
  .p3{ animation-delay: calc(-1s / var(--sp)); }

  .beam{ animation: beam 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes beam{ 0%,100%{ opacity:.55; } 50%{ opacity:.85; } }

  .cloak{ transform-box: fill-box; transform-origin: 100% 0%; animation: flap calc(.7s / var(--sp)) ease-in-out infinite alternate; }
  @keyframes flap{ from{ transform: rotate(-4deg) scaleY(.94);} to{ transform: rotate(7deg) scaleY(1.06);} }
  .ribbon{ transform-box: fill-box; transform-origin: 0% 50%; animation: flap2 calc(.55s / var(--sp)) ease-in-out infinite alternate; }
  @keyframes flap2{ from{ transform: rotate(6deg);} to{ transform: rotate(-8deg);} }

  .lantern{ transform-box: fill-box; transform-origin: 50% -30%; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform: rotate(-7deg);} to{ transform: rotate(7deg);} }

  .glowpulse{ animation: glowp 2.2s ease-in-out infinite alternate; }
  @keyframes glowp{ from{ opacity:.45; } to{ opacity:1; } }

  .star{ animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.15; } to{ opacity:.95; } }

  .speedline{ animation: dash calc(.9s / var(--sp)) linear infinite; }
  @keyframes dash{
    0%   { transform: translateX(140px); opacity:0; }
    12%  { opacity:.9; }
    100% { transform: translateX(-460px); opacity:0; }
  }

  .petal{ transform-box: fill-box; transform-origin: center; animation: fall calc(7s / var(--sp)) linear infinite; }
  @keyframes fall{
    0%  { transform: translate(0,-40px) rotate(0deg); opacity:0; }
    10% { opacity:.9; }
    100%{ transform: translate(-260px, 620px) rotate(720deg); opacity:0; }
  }

  .flag{ transform-box: fill-box; transform-origin: 0% 50%; animation: flap2 calc(.45s / var(--sp)) ease-in-out infinite alternate; }

  /* ---------- HTML 覆盖层 ---------- */
  .brand{
    position:absolute; left:3.4%; top:7%;
    display:flex; flex-direction:column; align-items:center; gap:clamp(10px,1.4vw,22px);
    pointer-events:none; user-select:none;
  }
  .title{
    writing-mode:vertical-rl; letter-spacing:.32em;
    font-size:clamp(18px,2.6vw,40px);
    text-shadow:0 0 18px rgba(232,182,76,.75), 0 2px 10px #000;
  }
  .title small{ display:block; font-size:.42em; letter-spacing:.5em; color:#e8b64c; opacity:.9; margin-right:.4em; }
  .seal{
    width:clamp(26px,3.1vw,46px); height:clamp(26px,3.1vw,46px);
    background:var(--red); color:#fff5e0; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; letter-spacing:.05em; font-size:clamp(10px,1.1vw,15px);
    box-shadow:0 0 22px rgba(200,50,43,.6); opacity:.92;
  }
  .poem{
    position:absolute; right:3%; bottom:9%; text-align:right; line-height:1.9;
    font-size:clamp(11px,1.15vw,18px); color:#f3e6c8; opacity:.82;
    text-shadow:0 0 14px #000; pointer-events:none; user-select:none;
  }
  .poem b{ color:var(--gold); font-weight:normal; }

  .panel{
    position:absolute; right:2.2%; top:4%; display:flex; gap:8px; align-items:center;
  }
  .panel button{
    font-family:inherit; font-size:13px; color:#f3e6c8; cursor:pointer;
    background:rgba(20,12,28,.55); border:1px solid rgba(232,182,76,.4);
    padding:6px 13px; border-radius:20px; backdrop-filter:blur(4px);
    transition:.25s; letter-spacing:.1em;
  }
  .panel button:hover{ background:rgba(232,182,76,.22); border-color:var(--gold); }
  .panel button.on{ background:rgba(232,182,76,.85); color:#1a1008; border-color:var(--gold); }
  .hint{
    position:absolute; left:50%; bottom:2.2%; transform:translateX(-50%);
    font-size:12px; letter-spacing:.22em; color:#f3e6c8; opacity:.45; pointer-events:none;
  }
  .paused .layer, .paused .bike, .paused .wheel, .paused .puff,
  .paused .petal, .paused .speedline, .paused .lantern, .paused .cloak,
  .paused .ribbon, .paused .flag{ animation-play-state: paused; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">

    <svg viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

<script>
  const frame = document.getElementById('frame');
  const root  = document.documentElement;
  const btnT  = document.getElementById('btnTurbo');
  const btnP  = document.getElementById('btnPause');
  const btnR  = document.getElementById('btnReset');

  let turbo = false, paused = false, baseSpeed = 1;

  function applySpeed(){
    root.style.setProperty('--sp', (turbo ? baseSpeed * 2.4 : baseSpeed).toFixed(2));
    btnT.classList.toggle('on', turbo);
    btnT.textContent = turbo ? '巡航' : '加速';
  }
  function togglePause(){
    paused = !paused;
    frame.classList.toggle('paused', paused);
    btnP.textContent = paused ? '继续' : '暂停';
    btnP.classList.toggle('on', paused);
  }

  [btnT,btnP,btnR].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
  btnT.onclick = () => { turbo = !turbo; applySpeed(); };
  btnP.onclick = togglePause;
  btnR.onclick = () => { turbo=false; paused=false; baseSpeed=1; frame.classList.remove('paused');
                         btnP.textContent='暂停'; btnP.classList.remove('on'); applySpeed(); };

  // 点击 / 空格：按住加速
  const speedUp = () => { if(!turbo){ root.style.setProperty('--sp',(baseSpeed*2.4).toFixed(2)); } };
  const speedOff= () => { applySpeed(); };
  frame.addEventListener('pointerdown', speedUp);
  frame.addEventListener('pointerup', speedOff);
  frame.addEventListener('pointerleave', speedOff);
  addEventListener('keydown', e => { if(e.code === 'Space'){ e.preventDefault(); speedUp(); } });
  addEventListener('keyup',   e => { if(e.code === 'Space'){ e.preventDefault(); speedOff(); } });

  applySpeed();
</script>
